<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User</title>
    <link rel="stylesheet" href="./style/style.css">
    <link rel="stylesheet" href="./style/user_style.css">
    <link rel="icon" type="image/png" href="./icons/website_logo.png">
   
</head>
<body>
    <main>
        <section class="account-section" id="login-section">
            <h1>Login</h1>
            <form action="#" method="post">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="Enter your email" required>
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Enter your password" required>
                <button type="submit">Login</button>
            </form>
            <p class="account-switch">
                Dont have an account?
                <a href="#" id="show-register">Register</a>
            </p>
        </section>
        <section class="account-section" id="register-section" hidden>
            <h1>Create Account</h1>
            <form action="./register.php" method="post">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" placeholder="Enter your email" required>
                <label for="register-email">Email</label>
                <input type="email" id="register-email" name="email" placeholder="Enter your email" required>
                <label for="register-password">Password</label>
                <input type="password" id="register-password" name="password" placeholder="Enter your password" required>
                <label for="confirm-password">Confirm password</label>
                <input type="password" id="confirm-password" name="confirm_password" required>
                <button type="submit">Register</button>
            </form>
            <p class="account-switch">
                Already have an account?
                <a href="#" id="show-login">Login</a>
            </p>
        </section>

    
    </main>
     <script src="./js/js.js"></script>
</body>
</html>
